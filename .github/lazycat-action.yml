update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: livebook
build:
  toolchains: []
  run_buildscript: false
images:
  - id: livebook
    target: service
    service: livebook
    source: ghcr.io/livebook-dev/livebook
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: livebook
    skip_if_version_exists: true
